<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .btn-huawei {
            background-color: #ce0e2d;
            color: #ffffff;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-huawei:hover {
            background-color: #a80b24;
        }
        .btn-huawei:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Redirección directa al hacer clic -->
    <button class="btn-huawei" onclick="window.location.href='http://192.168.100.1'">
        Ingresar a ONT Huawei
    </button>

</body>
</html>
