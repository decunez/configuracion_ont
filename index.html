<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0284c7">
    <title>Gestion ONT</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-wrapper">
        <!-- Tarjeta 1: Sección DNS -->
        <div class="card">
            <h2>Sección DNS</h2>

            <div class="field-group">
                <label for="dns1">DNS 1:</label>
                <div class="input-box">
                    <input type="text" id="dns1" value="200.63.105.194" readonly>
                </div>
            </div>

            <div class="field-group">
                <label for="dns2">DNS 2:</label>
                <div class="input-box">
                    <input type="text" id="dns2" value="45.236.107.126" readonly>
                </div>
            </div>

            <button class="btn-copy" style="width: 100%; margin-top: 12px;"
                onclick="copiarSecuencial(['dns2', 'dns1'], this)">Copiar DNS</button>
        </div>

        <!-- Tarjeta 2: RED Wi-Fi -->
        <div class="card">
            <h2>RED Wi-Fi</h2>

            <div class="field-group">
                <label for="wifi-name">Nombre de red:</label>
                <div class="input-box">
                    <input type="text" id="wifi-name" placeholder="Escribe el nombre de red"
                        oninput="validarInputsWifi()">
                </div>
            </div>

            <div class="field-group">
                <label for="wifi-pass">Contraseña:</label>
                <div class="input-box">
                    <input type="text" id="wifi-pass" placeholder="Escribe la contraseña" oninput="validarInputsWifi()">
                </div>
            </div>

            <button class="btn-copy" style="width: 100%; margin-top: 12px;" onclick="copiarWifi(this)">Copiar datos
                Wi-Fi</button>
        </div>

        <h1>ACCESO ONT</h1>

        <div class="btn-container">
            <button class="btn huawei" onclick="abrirOnt('http://192.168.18.1', this)">HUAWEI</button>
            <button class="btn tplink" onclick="abrirOnt('http://192.168.1.1/superadmin', this)">TP-LINK</button>
            <button class="btn netlife" onclick="abrirOnt('http://192.168.100.1/', this)">NETLIFE</button>
        </div>

        <!-- Sección Acceso IPlanet -->
        <h1>ACCESO IPLANET</h1>

        <div class="btn-container">
            <button class="btn ventas" onclick="abrirOnt('http://iplanet.ec:82/ventas/', this)">VENTAS</button>
            <button class="btn vistas"
                onclick="abrirOnt('http://iplanet.ec:82/soportejsx/reparaciones', this)">VISITAS</button>
        </div>

    </div>

    <footer style="text-align: center; padding: 1.5rem 0; color: #718096;">
        <p>&copy; 2026 Daniel Cuñez - Todos los derechos reservados</p>
    </footer>

    <script>
        // Función para redirigir a las páginas de ONT y accesos
        async function abrirOnt(url, boton) {
            // 1. Comprobación rápida de estado de red del dispositivo
            if (!navigator.onLine) {
                alert("No está conectado a la red");
                return;
            }

            const textoOriginal = boton.innerText;
            boton.innerText = "Verificando...";
            boton.disabled = true;

            // 2. Verificación mediante imagen (evita el bloqueo estricto de fetch en móviles)
            const probarConexion = new Promise((resolve, reject) => {
                const img = new Image();
                const timer = setTimeout(() => {
                    img.src = "";
                    reject("timeout");
                }, 2000);

                // Si responde (sea imagen o error 404/200), la IP es alcanzable en la red
                img.onload = img.onerror = () => {
                    clearTimeout(timer);
                    resolve();
                };

                const urlBase = url.replace(/\/$/, '');
                img.src = `${urlBase}/favicon.ico?_=${Date.now()}`;
            });

            try {
                await probarConexion;
                window.location.href = url;
            } catch (error) {
                alert("No está conectado a la red");
            } finally {
                // Restablece el botón sin importar el resultado
                boton.innerText = textoOriginal;
                boton.disabled = false;
            }
        }
        // Función para copiar elementos secuencialmente al portapapeles
        async function copiarSecuencial(arrayIds, boton) {
            const valores = arrayIds
                .map(id => document.getElementById(id).value.trim())
                .filter(val => val !== "");

            if (valores.length === 0) return;

            for (const texto of valores) {
                await navigator.clipboard.writeText(texto);
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            const textoOriginal = boton.innerText;
            boton.innerText = "¡Copiados!";
            boton.classList.add("copied");

            setTimeout(() => {
                boton.innerText = textoOriginal;
                boton.classList.remove("copied");
            }, 1500);
        }


        async function copiarWifi(boton) {
            const nombre = document.getElementById('wifi-name').value.trim();
            const pass = document.getElementById('wifi-pass').value.trim();

            // Validar campos vacíos
            if (!nombre || !pass) {
                alert("Por favor, llena ambos campos (Nombre de red y Contraseña).");
                return;
            }

            // Validar que el nombre solo tenga letras, números y espacios (sin caracteres especiales)
            const regexValido = /^[a-zA-Z0-9\s]+$/;
            if (!regexValido.test(nombre)) {
                alert("El nombre de red solo debe contener letras, números y espacios.");
                return;
            }

            // Validar longitud mínima de 8 caracteres en la contraseña
            if (pass.length < 8) {
                alert("La contraseña debe tener al menos 8 caracteres.");
                return;
            }

            // Ejecuta la copia secuencial si todas las validaciones son correctas
            await copiarSecuencial(['wifi-pass', 'wifi-name'], boton);
        }


        function validarInputsWifi() {
            const inputNombre = document.getElementById('wifi-name');
            const inputPass = document.getElementById('wifi-pass');

            const nombreVal = inputNombre.value.trim();
            const passVal = inputPass.value;

            // Validación Nombre (no vacío y sin caracteres especiales)
            const regexValido = /^[a-zA-Z0-9\s]+$/;
            if (nombreVal !== "" && regexValido.test(nombreVal)) {
                inputNombre.classList.add('valid');
                inputNombre.classList.remove('invalid');
            } else {
                inputNombre.classList.add('invalid');
                inputNombre.classList.remove('valid');
            }

            // Validación Contraseña (mínimo 8 caracteres)
            if (passVal.length >= 8) {
                inputPass.classList.add('valid');
                inputPass.classList.remove('invalid');
            } else {
                inputPass.classList.add('invalid');
                inputPass.classList.remove('valid');
            }
        }

        // Ejecutar al cargar la página para que inicien en rojo por defecto
        window.addEventListener('DOMContentLoaded', validarInputsWifi);


        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker registrado con éxito'))
                    .catch(err => console.error('Error registrando Service Worker:', err));
            });
        }
    </script>

</body>

</html>
